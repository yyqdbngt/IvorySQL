# Fork-only PROBE workflow (characterisation run, not evidence): it dumps the raw
# regression output so the premise can be checked before any expected file is written.
name: iv-verify-ora-view-rule

on:
  push:
    branches:
      - iv-red/ora-view-rule
      - iv-fix/ora-view-rule
      - probe/ora-force-view-lifecycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gettext \
            libreadline-dev zlib1g-dev uuid-dev libxml2-dev libxslt1-dev \
            libicu-dev libipc-run-perl

      - name: Configure, build and install
        run: |
          set -o pipefail
          ./configure --prefix="$RUNNER_TEMP/install" --enable-cassert --enable-debug \
            --with-uuid=e2fs --with-libxml --with-libxslt --with-icu >configure.log 2>&1
          make -j"$(nproc)" world-bin >build.log 2>&1
          make install-world-bin >install.log 2>&1
          make -C contrib/ivorysql_ora install >contrib-install.log 2>&1

      - name: Oracle regression ora_force_view_lifecycle
        run: |
          set -o pipefail
          export PATH="$RUNNER_TEMP/install/bin:$PATH"
          echo "head: $(git rev-parse HEAD)"
          make -C contrib/ivorysql_ora oracle-check ORA_REGRESS='ora_force_view_lifecycle' > target.log 2>&1 || true
          tail -n 20 target.log

      - name: PROBE RAW OUTPUT (not evidence)
        if: always()
        run: |
          echo '===== RAW RESULTS (master, no expectations) ====='
          cat contrib/ivorysql_ora/results/ora_force_view_lifecycle.out 2>/dev/null || echo '(no results file)'
          echo '===== end ====='

      - name: Collect logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iv-probe-ora-force-view-lifecycle
          path: |
            *.log
            contrib/ivorysql_ora/results/
          if-no-files-found: warn